# Deploy carlton.dev — build in-repo, publish via GitHub Actions → Pages
#
# ACTIVE since 2026-07-02.
#
# ⚠️ 2026-07-05 deploy failures ("Deployments are only allowed from
# gh-pages"): the `github-pages` ENVIRONMENT carries a deployment-branch
# policy left over from the old site's branch-mode Pages (gh-pages only).
# configure-pages enablement:true canNOT rewrite environment policies —
# this is a one-time repo-settings fix:
#   Settings → Environments → github-pages → Deployment branches and tags
#   → add branch rule `astro` (keep or delete the gh-pages rule).
# Also confirm Settings → Pages → Source = "GitHub Actions".
# Then re-run the failed workflow.
#
# Model: the Astro source lives in this repo (branch `astro`), so no
# cross-repo PAT is needed — the default GITHUB_TOKEN deploys through
# actions/deploy-pages.
#
# Notes:
#   - Custom domain carlton.dev is configured in Pages settings;
#     public/CNAME also ships inside the build artifact.
#   - Adjust the trigger branch below if you deploy from a different branch.
#   - After first successful deploy: re-verify carlton.dev in Search Console.

name: Deploy to carlton.dev

on:
  push:
    branches: [astro, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages (enables the Actions source if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
