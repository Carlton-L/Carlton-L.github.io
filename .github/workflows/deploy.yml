# Deploy carlton.dev — build in-repo, publish via GitHub Actions → Pages
#
# ⚠️ NOT YET ACTIVE — becomes live when pushed to Carlton-L.github.io
#    AND Pages is switched to the Actions source. Don't push without OK.
#
# Model (decided 2026-07-02): the Astro source lives in the
# Carlton-L.github.io repo itself, so no cross-repo PAT is needed —
# the default GITHUB_TOKEN deploys through actions/deploy-pages.
#
# One-time setup:
#   - Carlton-L.github.io → Settings → Pages → Source: "GitHub Actions".
#   - Custom domain carlton.dev stays configured in Pages settings;
#     public/CNAME also ships inside the build artifact.
#   - Adjust the trigger branch below if you deploy from a different branch.
#   - After first deploy: re-verify carlton.dev in Search Console.

name: Deploy to carlton.dev

on:
  push:
    branches: [astro, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
