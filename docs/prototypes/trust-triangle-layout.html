<!-- Status: accepted · 2026-11-14 · Trust triangle card layout. Decided: C (triangle card + one notes card, cabled); no label on the triangle; three interior sections with icons: eye (observability), magnifier (traceability), joystick (steerability). A, B and the other trace icons stay as considered. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trust triangle layout · prototype</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #121212; --line: #2a2a2a; --text: #e9e9e9; --muted: #9a9a9a; --dim: #666;
    --signal: #3dff88; --amber: #ffb547; --gu: 26px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--sans); padding-top: 112px; }

  /* ── comparison chrome (outside the design) ── */
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 10; background: #f4f1ea; color: #1a1a1a; border-bottom: 1px solid #cfc8b8; padding: 10px 18px; font: 12px/1.4 var(--sans); }
  .bar .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .bar b { font-weight: 650; }
  .bar .grp { display: flex; gap: 4px; align-items: center; }
  .bar .grp span { color: #6b6457; margin-right: 4px; }
  .bar button { font: inherit; padding: 4px 10px; border: 1px solid #b9b09c; background: #fff; border-radius: 4px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .bar .rec { font-size: 10px; color: #8a5a00; margin-left: 2px; }
  .bar p { color: #4d473c; margin-top: 6px; max-width: 120ch; }
  .note { position: absolute; transform: translateY(-100%); font: 10px/1.3 var(--sans); color: #1a1a1a; background: #ffe9a8; padding: 2px 6px; border-radius: 3px; white-space: nowrap; top: -4px; left: 0; }
  .note.new { background: #bff5d3; }
  .note.cut { background: #ffc9c9; }
  .legend { display: inline-flex; gap: 8px; }
  .legend i { font-style: normal; padding: 1px 6px; border-radius: 3px; }

  /* ── the page ── */
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 30px 120px; }
  .rowp { display: flex; gap: var(--gu); margin-top: calc(var(--gu) * 2); align-items: flex-start; }
  .rowp.center { justify-content: center; }
  .rowp.between { justify-content: space-between; }
  .rowp.wide-gap { gap: calc(var(--gu) * 8); }
  .op { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 4px; flex: 0 0 auto; }
  .op .hd { display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); font: 9.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .op .hd .ty { color: var(--signal); }
  .op .bd { padding: 12px 14px; }
  .op.view .bd { padding: 0; }
  .op.brk { background: none; border: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 0; text-align: center; font: 11px/1 var(--mono); letter-spacing: .2em; color: var(--muted); }
  .op.brk b { color: var(--signal); font-weight: 400; margin-right: 12px; }

  body.read .page { max-width: 680px; }
  body.read .rowp { flex-direction: column; align-items: stretch; gap: var(--gu); margin-top: var(--gu); }
  body.read .op { width: auto !important; margin-top: 0 !important; }

  .meta { font: 9.5px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  h1 { font-weight: 900; text-transform: uppercase; font-size: 34px; line-height: .98; max-width: 16ch; }
  h2 { font-weight: 900; text-transform: uppercase; font-size: 22px; line-height: 1; margin-bottom: 8px; }
  h3 { font-weight: 800; font-size: 15px; margin-bottom: 6px; padding-right: 36px; }
  .sig { color: var(--signal); }
  .sub { font: 10.5px/1.7 var(--mono); color: var(--muted); margin-top: 10px; }
  p.cs { font-size: 13px; line-height: 1.65; }
  p.cs + p.cs { margin-top: 8px; }
  .num { position: absolute; right: 12px; top: 30px; font: 900 30px/1 var(--sans); color: #262626; }
  .wc { font: 9px/1 var(--mono); color: var(--dim); margin-top: 10px; letter-spacing: .08em; }
  .flag { display: inline-block; font: 9px/1.3 var(--mono); color: #1a1a1a; background: var(--amber); padding: 1px 5px; border-radius: 2px; letter-spacing: .04em; }

  .meter div { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; font: 9.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); margin-bottom: 7px; }
  .meter i { display: block; height: 4px; background: #262626; position: relative; }
  .meter i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--signal); }
  .meter i.q::after { background: var(--amber); }
  .meter .n { font-size: 9px; color: var(--dim); line-height: 1.6; margin-top: 8px; display: block; }

  .slot { display: grid; place-content: center; text-align: center; gap: 6px; border: 1px dashed #3a3a3a; margin: 10px; border-radius: 3px; font: 10px/1.6 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .slot b { color: var(--muted); font-weight: 400; }
  .slot.new { border-color: var(--signal); color: #8fd9ad; }
  .slot ol { text-align: left; margin: 8px auto 0; letter-spacing: .04em; color: #8fd9ad; padding-left: 18px; }

  /* triangle echo chip */
  .tri { display: inline-flex; align-items: center; gap: 6px; font: 9px/1 var(--mono); letter-spacing: .12em; color: var(--signal); border: 1px solid #1f5a37; border-radius: 3px; padding: 3px 7px 3px 5px; margin-bottom: 8px; }
  .tri svg { width: 13px; height: 12px; }
  .tri svg path { fill: none; stroke: #4c6b58; stroke-width: 1.2; }
  .tri svg circle { fill: #4c6b58; }
  .tri svg circle.on { fill: var(--signal); }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .facts dt { font: 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--dim); margin-bottom: 3px; }
  .facts dd { font-size: 12.5px; }

  .hl-opt { display: none; }
  body[data-hl="a"] .hl-opt[data-hl="a"], body[data-hl="b"] .hl-opt[data-hl="b"], body[data-hl="c"] .hl-opt[data-hl="c"] { display: block; }
  .hd-opt { display: none; }
  body[data-hd="a"] .hd-opt[data-hd="a"], body[data-hd="b"] .hd-opt[data-hd="b"], body[data-hd="c"] .hd-opt[data-hd="c"] { display: block; }
  body:not(.notes) .note { display: none; }
  @media (max-width: 700px) { body { padding-top: 0; } .bar { position: static; } }
  .tricard { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; }
  body.read .tricard { grid-template-columns: 1fr; }
  svg.big { width: 170px; height: 150px; display: block; }
  svg.big.lg { width: 100%; height: auto; max-width: 300px; margin: 0 auto; }
  svg.big path { fill: none; stroke: #3a3a3a; stroke-width: 1.2; }
  svg.big circle { fill: var(--signal); }
  svg.big .sec { fill: none; stroke: #2c2c2c; stroke-width: 1; }
  svg.big .ico * { fill: none; stroke: var(--signal); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  svg.big .ico .solid { fill: var(--signal); stroke: none; }
  svg.big text { fill: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
  dl.notes { display: grid; gap: 12px; }
  dl.notes dt, .cornerhd { font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--signal); margin-bottom: 4px; }
  dl.notes dd, .cornercopy { font-size: 13px; line-height: 1.55; }
  .pt { display: block; font: 9.5px/1.5 var(--mono); letter-spacing: .06em; color: var(--dim); margin-top: 3px; }
  .dirx { display: none; }
  body[data-dir="a"] .dirx[data-d="a"], body[data-dir="b"] .dirx[data-d="b"], body[data-dir="c"] .dirx[data-d="c"] { display: block; }
  svg.cab { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.cab path { fill: none; stroke: var(--signal); stroke-width: 1.2; opacity: .7; }
  body.read svg.cab { display: none; }
  .wrap { position: relative; }
</style>
</head>
<body class="notes" data-dir="a">
<div class="bar" role="region" aria-label="Prototype controls">
  <div class="row">
    <b>Trust triangle · card layout</b>
    <div class="grp" role="group" aria-label="Layout"><span>Layout</span>
      <button data-set-dir="a">A One card (original)</button>
      <button data-set-dir="b">B Triangle + three note cards</button>
      <button data-set-dir="c">C Triangle card + one notes card</button>
    </div>
    <div class="grp" role="group" aria-label="Trace icon"><span>Trace icon</span>
      <button data-icon="layers">Layers</button><button data-icon="chain">Chain link</button><button data-icon="trail">Trail to a pin</button><button data-icon="lineage">Lineage</button><button data-icon="magnifier">Magnifier</button>
    </div>
    <div class="grp" role="group" aria-label="Mode"><span>Mode</span>
      <button data-set-mode="patch">PATCH ≥1280</button><button data-set-mode="read">READ / phone</button>
    </div>
  </div>
  <p id="intro"></p>
</div>
<main class="page"><div class="wrap" id="wrap"><div id="page"></div><svg class="cab" id="cab" aria-hidden="true"></svg></div></main>
<script>
const N = {
  o: ['OBSERVABILITY', 'You can see what it is doing right now: which step is running, what it is reading, and how long it has been quiet.', '→ SECTION 01: LIVE RUN, LIVENESS, AGENT CARD'],
  t: ['TRACEABILITY', 'You can ask where any part came from and what was done with it. Dumping every detail on screen buries the answer, so it comes one layer at a time, as deep as you ask.', '→ SECTION 02: THE WORKFLOW REDESIGN'],
  s: ['STEERABILITY', 'You can change exactly the part you meant. Ask an image model to make the dog blue and it used to redraw the whole picture, sometimes with a blue giraffe in it. Steering means the dog turns blue and nothing else moves.', '→ SECTION 03: WHAT YOU CAN CHANGE'],
};
const ICON = {
  eye: '<path d="M-11,0 Q0,-9 11,0 Q0,9 -11,0 Z"/><circle cx="0" cy="0" r="3.4"/><circle class="solid" cx="0" cy="0" r="1.3"/>',
  joystick: '<rect x="-9" y="4" width="18" height="5" rx="1.6"/><path d="M0,4 L0,-4"/><circle cx="0" cy="-7" r="3.4"/><path d="M-5,4 L-5,2.5"/>',
  layers: '<path d="M0,-9 L10,-4.5 L0,0 L-10,-4.5 Z"/><path d="M-10,-0.5 L0,4 L10,-0.5"/><path d="M-10,3.5 L0,8 L10,3.5"/>',
  chain: '<g transform="rotate(-35)"><rect x="-11" y="-3.5" width="12" height="7" rx="3.5"/><rect x="-1" y="-3.5" width="12" height="7" rx="3.5"/></g>',
  trail: '<circle class="solid" cx="-9" cy="7" r="1.6"/><path d="M-9,7 C-3,7 -7,-1 0,0 S4,-4 5,-4" stroke-dasharray="1.6 2.4"/><path d="M7,-1 C3.5,-4.5 4,-10 7,-10 C10,-10 10.5,-4.5 7,-1 Z"/><circle class="solid" cx="7" cy="-6.6" r="1.1"/>',
  lineage: '<circle cx="0" cy="7" r="2.4"/><circle cx="-7" cy="-6" r="2.4"/><circle cx="7" cy="-6" r="2.4"/><path d="M0,4.6 L-5.6,-3.9 M0,4.6 L5.6,-3.9"/>',
  magnifier: '<circle cx="-2" cy="-2" r="6.5"/><path d="M2.8,2.8 L8.5,8.5"/><path d="M-5,-2 L1,-2 M-5,1 L-1,1"/>',
};
let traceIcon = 'magnifier';
const TRI = (cls = '') => `<svg class="big ${cls}" viewBox="0 0 170 150" aria-hidden="true"><path d="M85 22 L18 128 L152 128 Z"/>
  <path class="sec" d="M85,92.7 L51.5,75 M85,92.7 L118.5,75 M85,92.7 L85,128"/>
  <g class="ico" transform="translate(85 64) scale(1.05)">${ICON.eye}</g><g class="ico" transform="translate(60 106) scale(1.05)">${ICON[traceIcon]}</g><g class="ico" transform="translate(110 106) scale(1.05)">${ICON.joystick}</g>
  <circle cx="85" cy="22" r="5"/><circle cx="18" cy="128" r="5"/><circle cx="152" cy="128" r="5"/>
  <text x="85" y="10" text-anchor="middle">OBSERVE</text><text x="18" y="146" text-anchor="middle">TRACE</text><text x="152" y="146" text-anchor="middle">STEER</text></svg>`;
const op = (id, w, type, name, html, mt) => `<div class="op" id="${id}" style="width:calc(${w} / 12 * 100% - 13px);${mt ? `margin-top:calc(var(--gu) * ${mt});` : ''}"><div class="hd"><span class="ty">${type}</span>${name}</div><div class="bd">${html}</div></div>`;
const what = op('what', 5, 'TXT', 'txt · what_it_is', '<p class="cs" style="color:var(--dim)">What it is (above the triangle on the page).</p>');
const brk = `<div class="op brk" style="width:calc(8/12*100% - 13px)"><b>01</b>OBSERVABILITY</div>`;
const note = (k) => `<div class="cornerhd">${N[k][0]}</div><p class="cornercopy">${N[k][1]}</p><span class="pt">${N[k][2]}</span>`;
const shapes = () => ({
  a: [`<div class="rowp center">${what}</div>`,
      `<div class="rowp center">${op('tri', 8, 'TXT', 'txt · trust_triangle', `<p class="meta">How I judge an AI interface</p><div class="tricard">${TRI()}<dl class="notes">${['o', 't', 's'].map((k) => `<div><dt>${N[k][0]}</dt><dd>${N[k][1]}<span class="pt">${N[k][2]}</span></dd></div>`).join('')}</dl></div>`)}</div>`,
      `<div class="rowp center">${brk}</div>`],
  b: [`<div class="rowp center">${what}</div>`,
      `<div class="rowp center">${op('no', 4, 'TXT', 'txt · observability', note('o'))}</div>`,
      `<div class="rowp center" style="gap:calc(var(--gu) * 2);align-items:center">${op('nt', 3, 'TXT', 'txt · traceability', note('t'), 3)}${op('tri', 4, 'TXT', 'txt · trust_triangle', `<p class="meta">How I judge an AI interface</p>${TRI('lg')}`)}${op('ns', 3, 'TXT', 'txt · steerability', note('s'), 3)}</div>`,
      `<div class="rowp center">${brk}</div>`],
  c: [`<div class="rowp center">${what}</div>`,
      `<div class="rowp center wide-gap" style="gap:calc(var(--gu) * 4);align-items:center">${op('tri', 4, 'TXT', 'txt · trust_triangle', TRI('lg'))}${op('notes', 5, 'TXT', 'txt · three_corners', `<dl class="notes">${['o', 't', 's'].map((k) => `<div><dt>${N[k][0]}</dt><dd>${N[k][1]}<span class="pt">${N[k][2]}</span></dd></div>`).join('')}</dl>`)}</div>`,
      `<div class="rowp center">${brk}</div>`],
});
const INTRO = {
  a: 'A · One card (original): the triangle and the three notes together, as in the current wireframe. Simplest; reads as one statement.',
  b: 'B · Triangle + three note cards: each note is its own operator, placed by its corner (observe above, trace left, steer right) and cabled to it in PATCH mode. Uses the patch grammar; four cards to lay out, and in READ mode the triangle sits between the notes.',
  c: 'C · Triangle card + one notes card (chosen). Rev 2: no label on the triangle; three sections inside it, each with an icon. Pick a trace icon above.',
};
function cables() {
  const svg = document.getElementById('cab'), w = document.getElementById('wrap').getBoundingClientRect();
  if (document.body.classList.contains('read')) { svg.innerHTML = ''; return; }
  const r = (id) => { const e = document.getElementById(id); if (!e) return null; const b = e.getBoundingClientRect(); return { l: b.left - w.left, r: b.right - w.left, t: b.top - w.top, b: b.bottom - w.top, cx: (b.left + b.right) / 2 - w.left, cy: (b.top + b.bottom) / 2 - w.top }; };
  const tri = r('tri'), lines = [];
  const curve = (a, b) => { const my = (a[1] + b[1]) / 2; return `<path d="M${a[0]},${a[1]} C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}"/>`; };
  const curveH = (a, b) => { const mx = (a[0] + b[0]) / 2; return `<path d="M${a[0]},${a[1]} C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}"/>`; };
  const d = document.body.dataset.dir;
  if (d === 'b') { const o = r('no'), t = r('nt'), s = r('ns'); lines.push(curve([o.cx, o.b], [tri.cx, tri.t]), curveH([t.r, t.cy], [tri.l, tri.cy + 40]), curveH([tri.r, tri.cy + 40], [s.l, s.cy])); }
  if (d === 'c') { const n = r('notes'); lines.push(curveH([tri.r, tri.cy], [n.l, n.cy])); }
  svg.innerHTML = lines.join('');
}
const state = { dir: 'c', mode: 'patch' };
function apply() {
  document.body.dataset.dir = state.dir; document.body.classList.toggle('read', state.mode === 'read');
  document.querySelectorAll('[data-set-dir]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.setDir === state.dir));
  document.querySelectorAll('[data-set-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.setMode === state.mode));
  document.getElementById('intro').textContent = INTRO[state.dir] + ' ← → switch layouts.';
  traceIcon = state.icon || 'magnifier';
  document.querySelectorAll('[data-icon]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.icon === traceIcon));
  document.getElementById('page').innerHTML = shapes()[state.dir].join('');
  try { history.replaceState(null, '', `#dir=${state.dir}&mode=${state.mode}`); } catch (e) {}
  requestAnimationFrame(cables);
}
const h = new URLSearchParams(location.hash.slice(1));
if (['a', 'b', 'c'].includes(h.get('dir'))) state.dir = h.get('dir');
if (['patch', 'read'].includes(h.get('mode'))) state.mode = h.get('mode');
document.querySelectorAll('[data-set-dir]').forEach((b) => b.onclick = () => { state.dir = b.dataset.setDir; apply(); });
document.querySelectorAll('[data-set-mode]').forEach((b) => b.onclick = () => { state.mode = b.dataset.setMode; apply(); });
document.querySelectorAll('[data-icon]').forEach((b) => b.onclick = () => { state.icon = b.dataset.icon; apply(); });
document.addEventListener('keydown', (e) => { const o = ['a', 'b', 'c'], i = o.indexOf(state.dir);
  if (e.key === 'ArrowRight') { state.dir = o[(i + 1) % 3]; apply(); } if (e.key === 'ArrowLeft') { state.dir = o[(i + 2) % 3]; apply(); } });
window.addEventListener('resize', cables);
apply();
</script>
</body>
</html>
