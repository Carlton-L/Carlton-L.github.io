.elabel{position:absolute;pointer-events:all;display:flex;flex-direction:column;gap:1px;align-items:flex-start;max-width:170px;background:var(--card);border:1px solid var(--s2);border-radius:var(--r);padding:4px 7px;font-size:10.5px;line-height:1.3;color:var(--muted);text-align:left;box-shadow:var(--sh-card)}

.elabel.on{outline:2px solid var(--s2);outline-offset:2px}

.nho{background:var(--card);border:1.5px solid var(--s2);border-radius:var(--r);padding:8px 0;min-width:220px;box-shadow:var(--sh-card)}
.nho .hh{display:flex;align-items:baseline;gap:8px;padding:0 11px}
.nho .hh .micro{color:var(--s2)}.nho .hh b{font-size:13.5px;font-weight:600}.nho .hh .hs{margin-left:auto;font-size:11px;color:var(--muted)}
.nho.top .pedge.bottom{margin:8px 0 -8px}.nho.bottom .pedge.top{margin:-8px 0 8px}
.chip.lnk.out{background:var(--card)}
.react-flow__node.picked .nho{outline:2px solid var(--s2);outline-offset:2px}
.pin.hk span,.pout.hk span{color:var(--s2)}.hki{font-style:normal;color:var(--s2);font-size:10px}

.nio.tb{min-width:240px;width:auto;padding:8px 0}
.nio.tb .micro{display:block}.nio.tb p{margin:2px 11px 0;font-size:11px;opacity:.7}
.nio.tb .chip{background:var(--ink);color:var(--paper);border-color:rgba(127,127,120,.5)}
.nio.tb.top .pedge.bottom{margin:8px 0 -8px}.nio.tb.bottom .pedge.top{margin:-8px 0 8px}
.kbchip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--s3);padding:4px 11px 0}
.kbchip i{width:8px;height:8px;border-radius:50%;background:var(--s3);display:inline-block;flex:none}
.nres{width:620px;background:color-mix(in srgb,var(--s3) 7%,var(--card));border:1px solid var(--s3);border-radius:8px;padding:12px 0 12px}
.nres.rsf{border-color:var(--hair2);background:var(--panel)}
.nres .t{font-size:17px}.nres .rl{font-size:12px;color:var(--muted);padding:6px 11px 0}
.nres .micro{color:var(--s3)}.nres.rsf .micro{color:var(--muted)}
.react-flow__node.picked .nres{outline:2px solid var(--s3);outline-offset:2px}
.react-flow__edge.xw.late .react-flow__edge-path{stroke-dasharray:6 3}
table.kbt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.kbt th{font:600 9.5px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 3px;border-bottom:1px solid var(--hair2)}
.kbt td{padding:3px;border-bottom:1px solid var(--hair);vertical-align:top}
.kbt td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.kbt .olink{padding:0;margin:0;flex-direction:column;gap:0;align-items:flex-start}.kbt .olink em{font-size:10px}
.kc{font-size:10.5px;white-space:nowrap}
.kc.wired,.kc.held{color:var(--ok)}.kc.held-failed,.kc.wired-empty{color:var(--warn)}.kc.after{color:var(--muted)}.kc.before{color:var(--bad)}
.legend.kbl{flex-direction:column;gap:2px;margin-top:6px}.legend.kbl .kc{white-space:normal}.legend.kbl b{font-weight:600}
.lg.prod{background:var(--card);box-shadow:inset 0 -3px 0 var(--s1)}

/* knowledgebase gates */
.cyl{width:12px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;flex:none}
.ngate{width:236px;background:var(--card);border:2px solid var(--s3);border-radius:14px;box-shadow:var(--sh-card);cursor:pointer;color:var(--ink)}
.ngate .gk{display:flex;align-items:center;gap:6px;padding:7px 12px 6px;border-radius:12px 12px 0 0;background:color-mix(in srgb,var(--s3) 12%,var(--card));color:var(--s3)}
.ngate .gk .micro{color:inherit;flex:1}
.ngate .gst{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--f-ui);white-space:nowrap}
.ngate .gst i,.wgate em i,.gstates i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;border:1.5px solid currentColor}
.ngate .gt{font-size:13px;font-weight:600;padding:7px 12px 4px;line-height:1.3}
.ngate .gl{list-style:none;margin:0;padding:0 0 6px}
.ngate .gl li{position:relative;display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 12px;color:var(--muted)}
.ngate .gl li .react-flow__handle{left:-2px}
.ngate .gl li i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.ngate .gl li.ok{color:var(--ink)}.ngate .gl li.ok i{background:var(--s3);border-color:var(--s3)}
.ngate .gl li.bad i{background:var(--bad);border-color:var(--bad)}.ngate .gl li.bad{color:var(--bad)}
.ngate .gl li.gap i{background:var(--warn);border-color:var(--warn)}
.ngate .gout{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--hair);padding:6px 12px 7px;font-size:10.5px;color:var(--muted)}
.ngate .gout b{font-weight:600;color:var(--s3);white-space:nowrap}
.ngate .gout .react-flow__handle{right:-2px;background:var(--s3)}
.ngate.g-wait{border-style:dashed;border-color:color-mix(in srgb,var(--s3) 55%,var(--hair2))}
.ngate.g-wait .gk{background:var(--panel);color:var(--muted)}
.ngate.g-gaps{border-color:var(--warn)}.ngate.g-gaps .gk{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn)}
.ngate.g-gaps .gst i{background:var(--warn);border-color:var(--warn)}
.ngate.g-ready .gk{background:var(--s3);color:#fff}.ngate.g-ready .gst i{background:#fff;border-color:#fff}
.react-flow__node.picked .ngate{outline:2px solid var(--s3);outline-offset:3px}
.wgate{display:flex;align-items:center;gap:6px;margin:6px 11px 0;padding:4px 8px;border:1.5px solid var(--s3);border-radius:10px;font-size:11px;color:var(--s3)}
.wgate span{flex:1;font-weight:500}.wgate em{font-style:normal;display:inline-flex;align-items:center;gap:5px;font-size:10.5px}
.wgate.g-wait{border-style:dashed;color:var(--muted)}.wgate.g-gaps{border-color:var(--warn);color:var(--warn)}.wgate.g-gaps em i{background:var(--warn)}.wgate.g-ready em i{background:var(--s3)}
.rdr{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--s3);padding:4px 11px 0}.rdr.warn{color:var(--warn)}.rdr.bad{color:var(--muted)}
.react-flow__edge.kbw .react-flow__edge-path{stroke:var(--s3);stroke-opacity:.9;stroke-width:1.75}
.nm.c-kb{border:2px solid var(--s3);border-radius:12px;color:var(--s3)}.nm.c-kb.g-wait{border-style:dashed;color:var(--muted)}.nm.c-kb.g-gaps{border-color:var(--warn);color:var(--warn)}
.lg.gate{border:2px solid var(--s3);border-radius:6px;background:var(--card)}
.key i.kg{border:2px solid var(--s3);border-radius:6px}
.gview{display:flex;justify-content:center;padding:4px 0}
.gstates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.gstates li{display:grid;grid-template-columns:14px 1fr;column-gap:6px;font-size:12px;padding:5px 6px;border-radius:var(--r)}
.gstates li i{margin-top:4px}.gstates li span{grid-column:2;color:var(--muted)}
.gstates li.g-wait i{border-style:dashed;color:var(--faint)}.gstates li.g-gaps i{color:var(--warn);background:var(--warn)}.gstates li.g-ready i{color:var(--s3);background:var(--s3)}
.gstates li.on{background:var(--panel)}
.vlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.vlist li{display:flex;flex-direction:column;gap:1px;font-size:12px}.vlist li b{font-weight:500;font-size:11.5px}
.vlist li.early b{color:var(--bad)}.vlist li.gaps b{color:var(--warn)}.vlist li.ready b{color:var(--ok)}

/* run state on the board */
.dot.s-done,.dot.s-ok{background:var(--ok)}.dot.s-running,.dot.s-writing{background:var(--s1);animation:pulse 1s ease-in-out infinite}
.dot.s-wait,.dot.s-blank{border:1px solid var(--faint)}.dot.s-queued{border:1.5px solid var(--warn)}
.dot.s-failed{background:var(--bad)}.dot.s-skipped,.dot.s-empty{background:var(--hair2)}.dot.s-declined{background:var(--warn)}.dot.s-part{background:linear-gradient(90deg,var(--ok) 50%,var(--hair2) 50%)}
@keyframes pulse{50%{opacity:.35}}

.react-flow__node.st-early .np,.react-flow__node.st-early .nm{outline:2px solid var(--warn);outline-offset:2px}

/* panels and the run timeline */
.ptabs{display:flex;padding:0 12px;border-bottom:1px solid var(--hair)}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 8px;font-size:13px;color:var(--muted)}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tl{display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--hair);background:var(--panel)}
.tlp{width:30px;height:30px;border-radius:50%;border:0;background:var(--ink);display:grid;place-items:center;flex:none}
.tlp svg{width:12px;height:12px;fill:var(--paper)}
.tlmain{flex:1;min-width:0}
.tltrack{position:relative;height:34px}
.tlseg{position:absolute;top:12px;height:6px;background:var(--hair2);border-radius:3px;left:0}
.tlseg span{position:absolute;top:10px;left:0;font-size:10px;color:var(--muted);white-space:nowrap}
.tlseg.r span{left:10px}
.tlbrk{position:absolute;top:4px;height:22px;width:0;border-left:2px dashed var(--muted);margin-left:-1px;z-index:1}
.tlbrk span{position:absolute;top:-4px;left:6px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.tlfill{position:absolute;top:12px;height:6px;left:0;background:var(--ink);border-radius:3px}
.tlm{position:absolute;top:7px;width:2px;height:16px;margin-left:-1px;background:var(--s3);border-radius:1px}.tlm.gaps{background:var(--warn)}
.tlknob{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:2px solid var(--ink);pointer-events:none;z-index:2}
.tltrack input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:3}
.tltrack:has(input:focus-visible) .tlknob{outline:2px solid var(--ink);outline-offset:2px}
.tlr{min-width:230px;display:flex;flex-direction:column;line-height:1.3}.tlr b{font-size:12.5px;font-weight:600}.tlr span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .jbtn:disabled{opacity:.4;cursor:default}

.rp,.kp{display:grid;height:clamp(560px,calc(100vh - 220px),940px);min-height:0}
.rp{grid-template-columns:270px minmax(0,1fr)}
.rrail{border-right:1px solid var(--hair);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.rcount{font-size:12px;color:var(--muted)}.rcount b{font-size:22px;color:var(--ink);font-weight:600;margin-right:4px}
.rbar{display:flex;gap:2px;height:10px}.rbar i{flex:1;border-radius:1px;background:var(--hair2)}
.rbar i.s-done{background:var(--ok)}.rbar i.s-declined{background:var(--warn)}.rbar i.s-writing{background:var(--s1);animation:pulse 1s infinite}.rbar i.s-queued{background:color-mix(in srgb,var(--warn) 45%,var(--hair2))}.rbar i.s-skipped,.rbar i.s-empty{background:var(--panel2)}
.rtoc{list-style:none;margin:4px 0 0;padding:0}
.rtoc button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:4px 2px;font-size:12.5px;border-radius:var(--r)}
.rtoc button:hover{background:var(--panel)}.rtoc li.s-blank button{color:var(--muted)}
.rnote{background:var(--panel);border-radius:var(--r);padding:10px 12px;margin-top:6px}.rnote p{font-size:12px;margin:6px 0 0;line-height:1.5}
.rdoc{overflow:auto;padding:28px 40px 60px}
.rdoc>*{max-width:740px;margin-inline:auto}
.rhead h2{font-size:24px;margin:4px 0 4px;font-weight:600;text-wrap:balance}.rhead p{margin:0;font-size:12.5px}
.rpart h3{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:600;margin:30px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--hair2)}
.rpart h3 span{font:600 11px var(--f-mono);color:var(--faint)}
.rsec{padding:10px 0 14px;border-bottom:1px dashed var(--hair)}
.rsec header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rsec h4{margin:0;font-size:14.5px;font-weight:600}.rsec.s-blank h4,.rsec.s-queued h4{color:var(--muted)}
.rsec header .olink{padding:0;margin:0;width:auto;flex:none}.rsec h4{flex:1}
.rstate{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:3px 0 8px}
.rph{border:1.5px dashed var(--hair2);border-radius:4px;padding:12px 14px;font-size:12px;color:var(--faint);min-height:58px;display:flex;align-items:center}
.rsec.k-figure .rph{min-height:84px;justify-content:center}
.rph.bad{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--hair2))}
.skel i{display:block;height:10px;margin:8px 0;border-radius:3px;background:linear-gradient(90deg,var(--panel2) 0%,var(--hair) 50%,var(--panel2) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.rtext{font-size:13.5px;line-height:1.6;margin:0}
.rfig{border:1px solid var(--hair);border-radius:4px;padding:10px 12px;display:flex;gap:14px;align-items:center}
.rfig svg{width:120px;height:40px;fill:var(--s1);opacity:.75;flex:none}.rfig svg rect:not(.th){}.rfig svg rect.th{fill:var(--ink);opacity:.5}
code.tok{font:500 11.5px var(--f-mono);background:color-mix(in srgb,var(--s1) 10%,var(--card));color:var(--s1);border-radius:3px;padding:0 4px;white-space:nowrap}
.rrail>*,.kmain>*,.kside>*{flex:none}
.kbt .vd{font-size:10.5px;padding:0 0 2px}.kbt .vd.early{color:var(--bad)}.kbt .vd.gaps{color:var(--warn)}
.kfeed li.k-lab{color:var(--muted);border-bottom:0}.rfig span{font-size:12px;color:var(--muted)}
.rsub{list-style:none;margin:0;padding:0}.rsub li{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.rsub li .skel i{margin:4px 0}
.rfoot{display:flex;align-items:center;gap:8px;margin-top:30px;font-size:12px;color:var(--muted)}

.kp{grid-template-columns:minmax(0,1fr) 380px}
.kmain{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:20px}
.khead h2{font-size:20px;margin:4px 0 4px;font-weight:600}.khead p{margin:0;font-size:13px;max-width:70ch;color:var(--muted)}
.kstats{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.kstats div{border:1px solid var(--hair);border-radius:var(--r);padding:8px 12px;font-size:11.5px;color:var(--muted);min-width:150px}
.kstats b{display:block;font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kblk{display:flex;flex-direction:column;gap:8px}.kblk p{margin:0;font-size:12px}
.kgates{display:flex;flex-wrap:wrap;gap:12px}
svg.grow{width:100%;max-width:760px;height:auto}
svg.grow .gl{stroke:var(--hair)}svg.grow .ax{font:10px var(--f-ui);fill:var(--muted)}
svg.grow .ln{fill:none;stroke:var(--s3);stroke-width:2}
svg.grow .rd{fill:var(--card);stroke:var(--s3);stroke-width:2}svg.grow g.on .rd{fill:var(--s3)}svg.grow g:not(.on) .rd{opacity:.35}
svg.grow .now{stroke:var(--ink);stroke-dasharray:3 3}svg.grow .brk{stroke:var(--muted);stroke-dasharray:2 3}
.kfeed{list-style:none;margin:0;padding:0}
.kfeed li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--hair);font-size:12px}
.kfeed .kt{font:11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.kfeed .olink{padding:0;margin:0}.kfeed .kk{font-style:normal;font-size:10.5px;color:var(--muted)}
.kfeed li.k-research .olink span{font-weight:600}.kfeed li.k-research .kk{color:var(--s3);font-weight:600}
.kside{border-left:1px solid var(--hair);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.kside .kbt tr.warn td.num{color:var(--warn)}
@media (max-width:560px){.tlseg span{display:none}}
@media (max-width:1000px){.rp,.kp{grid-template-columns:1fr;height:auto}.rrail{border-right:0;border-bottom:1px solid var(--hair)}.kside{border-left:0;border-top:1px solid var(--hair)}.rdoc{padding:20px 16px}.tl{flex-wrap:wrap}.tlr{min-width:0}}

/* knowledgebase file nodes */
.nfile{color:var(--ink);cursor:pointer}
.nfile.glyph{width:220px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-align:center}
.nfile.glyph .fc{position:relative;width:64px;height:64px;box-sizing:border-box;border-radius:50%;border:2px solid var(--hair2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--faint);margin-bottom:5px;box-shadow:var(--sh-card)}
.nfile.glyph b{font-size:13px;font-weight:600}.nfile.glyph em{font-style:normal;font-size:11.5px;color:var(--muted)}
.nfile svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.nfile .gl-wait{width:26px;height:26px;stroke-width:2;stroke-dasharray:3 3.3}
.nfile .gl-ok{width:28px;height:28px;stroke-width:2.4}.nfile .gl-x{width:24px;height:24px;stroke-width:2.4}
.nfile .gl-drop{position:relative;width:26px;height:26px}.nfile .gl-drop svg{position:absolute;inset:0;width:26px;height:26px;stroke-width:2}
.nfile .gl-drop .drop{animation:kbdrop 1.2s ease-in infinite}
@keyframes kbdrop{0%{transform:translateY(-5px);opacity:0}40%{opacity:1}100%{transform:translateY(3px);opacity:0}}
.nfile .kbm{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;box-sizing:border-box;border-radius:50%;background:var(--card);border:1.5px solid var(--hair2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.nfile .kbm .cyl{width:9px;height:11px;stroke-width:2}
.nfile .try{position:absolute;right:-12px;top:-8px;height:18px;padding:0 6px;border-radius:9px;background:var(--s1);color:#fff;font:600 10px/18px var(--f-ui);font-style:normal;white-space:nowrap}
.nfile.f-retry .fc{border-color:var(--s1);color:var(--s1)}.nfile.f-retry em{color:var(--s1)}.nfile.f-retry .kbm{border-color:var(--s1);color:var(--s1)}
.nfile.f-filed .fc{border-color:#13865d;background:#13865d;color:#fff}.nfile.f-filed em{color:var(--ok)}.nfile.f-filed .kbm{border-color:#13865d;color:#13865d}
.nfile.f-failed .fc{border-color:var(--bad);color:var(--bad)}.nfile.f-failed em{color:var(--bad)}.nfile.f-failed .kbm{border-color:var(--bad);color:var(--bad)}
.nfile.glyph .fc .react-flow__handle{top:50%}
.nfile.pill{position:relative;width:220px;height:52px;box-sizing:border-box;border-radius:26px;border:2px dashed var(--hair2);background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px 0 6px;box-shadow:var(--sh-card)}
.nfile.pill .fc{position:relative;width:36px;height:36px;flex:none;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.nfile.pill .fc .cyl{width:15px;height:17px;stroke-width:1.6}.nfile.pill .fc .gl-ok{width:18px;height:18px;stroke-width:2.6}
.nfile.pill .fc .bang{color:#fff;font-size:16px}
.nfile.pill .fx{display:flex;flex-direction:column;min-width:0;line-height:1.3}.nfile.pill .fx b{font-size:13px;font-weight:600}.nfile.pill .fx em{font-style:normal;font-size:11.5px;color:var(--muted)}
.nfile.pill .spin{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--s1);animation:kbspin 1s linear infinite}
@keyframes kbspin{to{transform:rotate(360deg)}}

    if (st === 'skipped' || st === 'empty' || st === 'declined') return html`<div class="rph bad">${SECW[st]}</div>`;
    if (k === 'figure') return html`<div class="rfig"><svg viewBox="0 0 120 40" aria-hidden="true">${i.type === 'viz/table' ? [0, 1, 2, 3].flatMap(r => [0, 1, 2].map(c => html`<rect key=${r + '.' + c} class=${r ? '' : 'th'} x=${4 + c * 38} y=${2 + r * 9.5} width="35" height="7.5" rx="1" />`)) : [14, 22, 18, 30, 26, 34, 24].map((v, j) => html`<rect key=${j} x=${4 + j * 16} y=${38 - v} width="10" height=${v} rx="1.5" />`)}</svg><span>${i.type === 'viz/table' ? 'Table' : 'Chart'} · drawn in code from recorded data</span></div>`;
    if (id === '58') return html`<ol class="rsub">${(i.subs || []).map(([a0, dd], j) => { const a = a0 + SIM.shift58; const ss = t < a ? 'blank' : t < a + dd ? 'writing' : 'done'; return html`<li key=${j} class=${ss}><b>Topic ${j + 1}</b>${ss === 'writing' ? html`<${Skel} n=${2} />` : ss === 'done' ? html`<span>Written in ${fmtT(dd)}</span>` : html`<span class="mut">Not started</span>`}</li>`; })}</ol>`;
    return i.out ? html`<p class="rtext">${withTokens(i.out)}</p>` : html`<p class="rtext mut">Written in ${fmtT(i.dur)}. The text is not captured in this prototype.</p>`;
  };
  return html`<article class=${'rsec k-' + k + ' s-' + st} id=${'rs-' + id}>
    <header><h4>${title}</h4><button type="button" class="olink" onClick=${() => reveal(id)}><em class="src">${placeOf(id)}</em></button></header>
    <div class="rstate"><i class=${'dot s-' + st}></i>${SECW[st]}${st === 'done' && i.dur ? ' · ' + fmtT(i.dur) : ''}${isFlagged(id, t) ? html`<span class="flag">Written without the question research</span>` : null}</div>
    ${body()}
  </article>`;
}
function ReportPanel({ t, reveal }) {
  const items = REPORT_OUTLINE.flatMap(([, it]) => it.map(x => x[0]));
  const cnt = s => items.filter(id => secState(id, t) === s).length;
  const nflag = items.filter(id => isFlagged(id, t)).length;
  const asm = stepState('105', t), pub = stepState('106', t);
  const go = k => { const el = document.getElementById('rp-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  return html`<div class="rp">
    <aside class="rrail">
      <span class="micro">Report so far</span>
      <div class="rcount"><b>${cnt('done') + cnt('declined')}</b> of ${items.length} written${cnt('writing') ? html`<span> · ${cnt('writing')} writing</span>` : null}${cnt('queued') ? html`<span> · ${cnt('queued')} waiting their turn</span>` : null}${cnt('skipped') + cnt('empty') ? html`<span> · ${cnt('skipped') + cnt('empty')} skipped or empty</span>` : null}</div>
      <div class="rbar">${items.map(id => html`<i key=${id} class=${'s-' + secState(id, t) + (isFlagged(id, t) ? ' fl' : '')} title=${nameOf(id)}></i>`)}</div>
      ${nflag ? html`<div class="rflagn"><span class="flag">${nflag} written without the question research</span></div>` : null}
      <ol class="rtoc">${REPORT_OUTLINE.map(([title, it], k) => { const ss = it.map(x => secState(x[0], t)); const st = !it.length ? (asm === 'done' ? 'done' : 'blank') : ss.includes('writing') ? 'writing' : ss.every(x => x !== 'blank' && x !== 'queued') ? 'done' : ss.some(x => x === 'done') ? 'part' : 'blank';
        const fl = it.some(x => isFlagged(x[0], t));
        return html`<li key=${title} class=${'s-' + st}><button type="button" onClick=${() => go(k)}><i class=${'dot s-' + st}></i><span>${k + 1}. ${title}</span>${fl ? html`<em class="fl">flagged</em>` : null}</button></li>`; })}</ol>
      <div class="rnote"><span class="micro">Why sections write one at a time</span><p>Each writer reads every section already written, so it can add instead of repeat. To make sure those sections exist, the engine chains all 21 writers in a fixed order. In this run, writing took 29 of the 38 minutes, all in single file.</p>
        <p>“Link Prediction: Emerging Papers” was skipped: its gate found no candidates. The writer after it went straight on.</p></div>
    </aside>
    <div class="rdoc" role="document">
      <div class="rhead"><span class="micro">Futurity Insight Report</span><h2>Small Modular Reactors</h2><p class="mut">Sections appear in the template's order. They are written in a different order, as their inputs come in.</p></div>
      ${REPORT_OUTLINE.map(([title, it], k) => html`<section key=${title} class="rpart" id=${'rp-' + k}><h3><span>${k + 1}</span>${title}</h3>
        ${it.length ? it.map(([id, tt]) => html`<${RSection} key=${id} id=${id} title=${tt} t=${t} reveal=${reveal} />`) : html`<article class=${'rsec k-built s-' + (asm === 'done' ? 'done' : asm === 'running' ? 'writing' : 'blank')}><div class="rstate"><i class=${'dot s-' + (asm === 'done' ? 'done' : 'blank')}></i>${asm === 'done' ? 'Built' : 'Built when the report is assembled'}</div>${asm === 'done' ? html`<p class="rtext mut">${BUILT[title]}</p>` : html`<div class="rph">${BUILT[title]}</div>`}</article>`}
      </section>`)}
      <div class=${'rfoot s-' + pub}><i class=${'dot s-' + pub}></i>${pub === 'done' ? `Assembled and published ${fmtClock(SIM.fin['106'])} in.` : asm === 'running' ? 'Assembling' : 'Assemble and Publish run when every section is in.'}</div>
    </div>
  </div>`;
}

/* ---------- knowledgebase panel ---------- */
const depName = k => { const m = k.match(/^58\[(\d+)\]:(\d+)$/); return m ? nameOf(m[2]) + ' · topic ' + (+m[1] + 1) : nameOf(k); };
const depWs = k => { const b = k.startsWith('58[') ? '58' : k; const w = wsOf(b); return w ? WS[w].title : 'Report'; };
const DEPK = { research: 'Research', section: 'Section', ai: 'Agent finding', data: 'Data', report: 'Report' };
function Growth({ t }) {
  const W = 640, H = 150, P = { l: 30, r: 10, t: 12, b: 22 };
  const D_ = SIM.deps, max = D_.length;
  const x = tt => P.l + toD(tt) / DTOT * (W - P.l - P.r), y = n => H - P.b - n / max * (H - P.t - P.b);
  let pts = `M${x(SEG[0][0])},${y(0)}`; D_.forEach((d, k) => { if (d[0] <= t) pts += ` H${x(d[0])} V${y(k + 1)}`; });
  const nNow = D_.filter(d => d[0] <= t).length; pts += ` H${x(t)}`;
  const bx = SEG.length > 1 ? x(SEG[0][1]) : null;
  return html`<svg class="grow" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`Items filed in the knowledgebase over the run: ${nNow} of ${max} so far`}>
    ${[0, Math.round(max / 2), max].map(v => html`<g key=${v}><line x1=${P.l} x2=${W - P.r} y1=${y(v)} y2=${y(v)} class="gl" /><text x=${P.l - 6} y=${y(v) + 3} class="ax" text-anchor="end">${v}</text></g>`)}
    ${bx != null ? html`<line x1=${bx} x2=${bx} y1=${P.t} y2=${H - P.b} class="brk" /><text x=${bx + 4} y=${H - 8} class="ax">resumed</text>` : null}<text x=${P.l} y=${H - 8} class="ax">launch</text>
    <path d=${pts} class="ln" />
    ${D_.filter(d => d[2] === 'research').map(d => html`<g key=${d[1]} class=${d[0] <= t ? 'on' : ''}><circle cx=${x(d[0])} cy=${y(D_.indexOf(d) + 1)} r="4.5" class="rd" /><title>${nameOf(d[1])}: filed ${fmtT(d[0])} in</title></g>`)}
    <line x1=${x(t)} x2=${x(t)} y1=${P.t} y2=${H - P.b} class="now" />
  </svg>`;
}
function KbPanel({ t, reveal, fileLook }) {
  const D_ = SIM.deps.filter(d => d[0] <= t);
  const byK = k => D_.filter(d => d[2] === k).length;
  const fs = Object.keys(FILES), filed = fs.filter(f => fileState(f, t) === 'filed').length;
  const feed = [...D_].reverse().slice(0, 40);
  const without = KBR.readers.filter(r => SIM.without[r[0]]).length;
  const rstate = r => { const s = stepState(r[0], t); return s === 'wait' ? 'Waiting' : s === 'paused' ? 'Paused' : s === 'running' ? (SIM.without[r[0]] ? 'Searching without the question' : 'Searching') : (SIM.without[r[0]] ? 'Done without the question' : 'Done'); };
  return html`<div class="kp">
    <div class="kmain">
      <div class="khead"><span class="micro">Knowledgebase</span><h2>What steps can search</h2>
        <p>It starts with the lab's own material. Then it fills with what this run files: every page a research job reads, its report, and each step's output as the step finishes. Earlier runs are never in it.</p>
        <div class="kstats"><div><b>${filed}</b>of 4 research jobs filed</div><div><b>${D_.length - byK('research') - byK('report')}</b>step outputs filed</div><div><b>${KBR.readers.filter(r => ['running', 'done'].includes(stepState(r[0], t))).length}</b>of ${KBR.readers.length} searchers started</div></div></div>
      <div class="kblk"><span class="micro">Research filings</span><div class="kfiles">${fs.map(f => html`<div key=${f} class="kf"><${FileFace} f=${f} st=${fileState(f, t)} look=${fileLook} handles=${false} onClick=${() => reveal(f)} /></div>`)}</div></div>
      <div class="kblk"><span class="micro">Filed over the run</span><${Growth} t=${t} /><p class="mut">Each step is one item filed. The four dots are the research jobs, which file many pages each. The page counts are not captured in this prototype.</p></div>
      <div class="kblk"><span class="micro">Filed, newest first</span>${feed.length ? html`<ol class="kfeed">${feed.map(([tt, k, kind]) => html`<li key=${k} class=${'k-' + kind}><span class="kt">${fmtClock(tt)}</span><button type="button" class="olink" onClick=${() => reveal(k.startsWith('58[') ? '58' : k)}><span>${depName(k)}</span><em class="src">${depWs(k)}</em></button><em class="kk">${DEPK[kind]}</em></li>`)}</ol>` : null}
        ${D_.length > 40 ? html`<p class="mut">and ${D_.length - 40} earlier</p>` : null}
        <ol class="kfeed"><li class="k-lab"><span class="kt">from the start</span><span>The lab's own material</span><em class="kk">Lab</em></li></ol></div>
    </div>
    <aside class="kside">
      <span class="micro">Who searches it</span>
      <table class="kbt"><thead><tr><th>Step</th><th>Now</th></tr></thead><tbody>${KBR.readers.map(r => { const s = rstate(r); return html`<tr key=${r[0]} class=${s === 'Paused' ? 'bad' : /without/.test(s) ? 'warn' : ''}><td><button type="button" class="olink" onClick=${() => reveal(r[0])}><span>${nameOf(r[0])}</span><em class="src">${WS[r[1]].title} · needs ${needsText(r[0])}</em></button></td><td class="num kn">${s}</td></tr>`; })}</tbody></table>
      <div class=${without ? 'warnnote' : 'oknote'}>${without ? html`<b>${without} of ${KBR.readers.length} searchers ran without the question research</b> in this replay. Their sections are flagged in the report.` : html`<b>Every searcher waited for all its filings</b> in this replay.`}</div>
      <p class="mut">In a run limited to the knowledgebase, searchers work only from what is filed.</p>
    </aside>
  </div>`;
}

const POL0 = STORY.policy;
function App() {
  const [stack, setStack] = useState(['report']);
  const [sel, setSel] = useState(null);
  const [theme, setTheme] = useState('auto');
  const [panel, setPanel] = useState('flow');
  const [showRun, setShowRun] = useState(true);
  const [fileLook, setFileLook] = useState('glyph');
  const [nodeLook, setNodeLook] = useState('glyph');
  const [pol, setPol] = useState(POL0);
  const sim = useMemo(() => simulate(pol), [pol]);
  useSim(sim);
  const [t, setT] = useState(() => sim.end);
  const [playing, setPlaying] = useState(false);
  useEffect(() => { if (t > sim.end) setT(sim.end); }, [sim]);
  useEffect(() => { if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => { if (!playing) return; const iv = setInterval(() => setT(t0 => { const d = toD(t0) + DTOT / 450; if (d >= DTOT) { setPlaying(false); return TEND; } return toT(d); }), 100); return () => clearInterval(iv); }, [playing, sim]);
  const act = a => setPol(p => ({ ...p, action: a }));
  const reveal = id => { setPanel('flow'); setShowRun(true); const p = pathTo(id); setStack(p.length ? p : ['report']); setSel(id); };
  const showTl = panel !== 'flow' || showRun;
  return html`<${Ctx.Provider} value=${{ t, showRun: true, pol, act, fileLook }}><div class="proto"><b>Prototype</b> Engine workstreams, blocks and steps, on a made-up run<span class="sep"></span>Theme ${['auto', 'light', 'dark'].map(k => html`<button type="button" key=${k} class=${'jbtn' + (theme === k ? ' on' : '')} onClick=${() => setTheme(k)}>${k}</button>`)}</div>
    <section class="instr" aria-label="Futurity Engine">
      <div class="ihead"><h2>Futurity Engine</h2><p>SMR data-centre outlook · Insight with Deep Search · 70 steps · finished 12 Nov 2026</p></div>
      <div class="sheet">
        <div class="ptabs" role="tablist" aria-label="Panels">${[['flow', 'Workflow'], ['report', 'Report'], ['kb', 'Knowledgebase']].map(([k, l]) => html`<button type="button" role="tab" key=${k} aria-selected=${panel === k} class=${panel === k ? 'on' : ''} onClick=${() => setPanel(k)}>${l}</button>`)}</div>
        ${showTl ? html`<${Timeline} t=${t} setT=${setT} playing=${playing} setPlaying=${setPlaying} pol=${pol} setPol=${setPol} />` : null}
        ${showTl ? html`<${Banner} t=${t} pol=${pol} act=${act} goReport=${() => setPanel('report')} />` : null}
        ${panel === 'flow' ? html`<${ReactFlowProvider}><${Board} stack=${stack} setStack=${setStack} sel=${sel} setSel=${setSel} showRun=${showRun} setShowRun=${setShowRun} t=${t} pol=${pol} act=${act} fileLook=${fileLook} setFileLook=${setFileLook} nodeLook=${nodeLook} setNodeLook=${setNodeLook} /><//>`
          : panel === 'report' ? html`<${ReportPanel} t=${t} reveal=${reveal} />` : html`<${KbPanel} t=${t} reveal=${reveal} fileLook=${fileLook} />`}
      </div>
    </section><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>

</body></html>
