<!-- Status: draft · 2026-11-14 (rev 3) · Engine case study restructure. Decided: shape A (built on the triangle); triangle as two cards (triangle with eye / magnifier / joystick, plus one notes card); hero becomes the workflow building over time (later); knowledge-graph decisions replaced; the "before" is a placeholder; the interactive triangle is parked in a GitHub issue. B and C kept as considered. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine case study restructure · prototype</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #121212; --line: #2a2a2a; --text: #e9e9e9; --muted: #9a9a9a; --dim: #666;
    --signal: #3dff88; --amber: #ffb547; --gu: 26px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--sans); padding-top: 112px; }

  /* ── comparison chrome (outside the design) ── */
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 10; background: #f4f1ea; color: #1a1a1a; border-bottom: 1px solid #cfc8b8; padding: 10px 18px; font: 12px/1.4 var(--sans); }
  .bar .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .bar b { font-weight: 650; }
  .bar .grp { display: flex; gap: 4px; align-items: center; }
  .bar .grp span { color: #6b6457; margin-right: 4px; }
  .bar button { font: inherit; padding: 4px 10px; border: 1px solid #b9b09c; background: #fff; border-radius: 4px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .bar .rec { font-size: 10px; color: #8a5a00; margin-left: 2px; }
  .bar p { color: #4d473c; margin-top: 6px; max-width: 120ch; }
  .note { position: absolute; transform: translateY(-100%); font: 10px/1.3 var(--sans); color: #1a1a1a; background: #ffe9a8; padding: 2px 6px; border-radius: 3px; white-space: nowrap; top: -4px; left: 0; }
  .note.new { background: #bff5d3; }
  .note.cut { background: #ffc9c9; }
  .legend { display: inline-flex; gap: 8px; }
  .legend i { font-style: normal; padding: 1px 6px; border-radius: 3px; }

  /* ── the page ── */
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 30px 120px; }
  .rowp { display: flex; gap: var(--gu); margin-top: calc(var(--gu) * 2); align-items: flex-start; }
  .rowp.center { justify-content: center; }
  .rowp.between { justify-content: space-between; }
  .rowp.wide-gap { gap: calc(var(--gu) * 8); }
  .op { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 4px; flex: 0 0 auto; }
  .op .hd { display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); font: 9.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .op .hd .ty { color: var(--signal); }
  .op .bd { padding: 12px 14px; }
  .op.view .bd { padding: 0; }
  .op.brk { background: none; border: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 0; text-align: center; font: 11px/1 var(--mono); letter-spacing: .2em; color: var(--muted); }
  .op.brk b { color: var(--signal); font-weight: 400; margin-right: 12px; }

  body.read .page { max-width: 680px; }
  body.read .rowp { flex-direction: column; align-items: stretch; gap: var(--gu); margin-top: var(--gu); }
  body.read .op { width: auto !important; margin-top: 0 !important; }

  .meta { font: 9.5px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  h1 { font-weight: 900; text-transform: uppercase; font-size: 34px; line-height: .98; max-width: 16ch; }
  h2 { font-weight: 900; text-transform: uppercase; font-size: 22px; line-height: 1; margin-bottom: 8px; }
  h3 { font-weight: 800; font-size: 15px; margin-bottom: 6px; padding-right: 36px; }
  .sig { color: var(--signal); }
  .sub { font: 10.5px/1.7 var(--mono); color: var(--muted); margin-top: 10px; }
  p.cs { font-size: 13px; line-height: 1.65; }
  p.cs + p.cs { margin-top: 8px; }
  .num { position: absolute; right: 12px; top: 30px; font: 900 30px/1 var(--sans); color: #262626; }
  .wc { font: 9px/1 var(--mono); color: var(--dim); margin-top: 10px; letter-spacing: .08em; }
  .flag { display: inline-block; font: 9px/1.3 var(--mono); color: #1a1a1a; background: var(--amber); padding: 1px 5px; border-radius: 2px; letter-spacing: .04em; }

  .meter div { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; font: 9.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); margin-bottom: 7px; }
  .meter i { display: block; height: 4px; background: #262626; position: relative; }
  .meter i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--signal); }
  .meter i.q::after { background: var(--amber); }
  .meter .n { font-size: 9px; color: var(--dim); line-height: 1.6; margin-top: 8px; display: block; }

  .slot { display: grid; place-content: center; text-align: center; gap: 6px; border: 1px dashed #3a3a3a; margin: 10px; border-radius: 3px; font: 10px/1.6 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .slot b { color: var(--muted); font-weight: 400; }
  .slot.new { border-color: var(--signal); color: #8fd9ad; }
  .slot ol { text-align: left; margin: 8px auto 0; letter-spacing: .04em; color: #8fd9ad; padding-left: 18px; }

  /* triangle echo chip */
  .tri { display: inline-flex; align-items: center; gap: 6px; font: 9px/1 var(--mono); letter-spacing: .12em; color: var(--signal); border: 1px solid #1f5a37; border-radius: 3px; padding: 3px 7px 3px 5px; margin-bottom: 8px; }
  .tri svg { width: 13px; height: 12px; }
  .tri svg path { fill: none; stroke: #4c6b58; stroke-width: 1.2; }
  .tri svg circle { fill: #4c6b58; }
  .tri svg circle.on { fill: var(--signal); }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .facts dt { font: 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--dim); margin-bottom: 3px; }
  .facts dd { font-size: 12.5px; }

  .hl-opt { display: none; }
  body[data-hl="a"] .hl-opt[data-hl="a"], body[data-hl="b"] .hl-opt[data-hl="b"], body[data-hl="c"] .hl-opt[data-hl="c"] { display: block; }
  .hd-opt { display: none; }
  body[data-hd="a"] .hd-opt[data-hd="a"], body[data-hd="b"] .hd-opt[data-hd="b"], body[data-hd="c"] .hd-opt[data-hd="c"] { display: block; }
  body:not(.notes) .note { display: none; }
  @media (max-width: 700px) { body { padding-top: 0; } .bar { position: static; } }
  .tricard { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: center; }
  body.read .tricard { grid-template-columns: 1fr; }
  .tricard svg.big { width: 170px; height: 150px; }
  .tricard svg.big path { fill: none; stroke: #3a3a3a; stroke-width: 1.2; }
  .tricard svg.big circle { fill: var(--signal); }
  .tricard svg.big text { fill: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
  .tricard dl { display: grid; gap: 10px; }
  svg.tri3 { width: 100%; height: auto; max-width: 300px; display: block; margin: 0 auto; }
  svg.tri3 path.e { fill: none; stroke: #3a3a3a; stroke-width: 1.2; }
  svg.tri3 .sec { fill: none; stroke: #2c2c2c; stroke-width: 1; }
  svg.tri3 circle.c { fill: var(--signal); }
  svg.tri3 text { fill: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
  svg.tri3 .ico * { fill: none; stroke: var(--signal); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  svg.tri3 .ico .solid { fill: var(--signal); stroke: none; }
  dl.notes3 { display: grid; gap: 12px; }
  dl.notes3 dt { font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--signal); margin-bottom: 4px; }
  dl.notes3 dd { font-size: 13px; line-height: 1.55; }
  dl.notes3 dd .pt { display: block; font: 9.5px/1.5 var(--mono); letter-spacing: .06em; color: var(--dim); margin-top: 3px; }
  .tricard dt { font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--signal); margin-bottom: 3px; }
  .tricard dd { font-size: 13px; line-height: 1.55; }
  .tricard dd .pt { display: block; font: 9.5px/1.5 var(--mono); letter-spacing: .06em; color: var(--dim); margin-top: 2px; }
  .before { height: 230px; margin: 10px; border: 1px solid #262626; border-radius: 3px; background: #0d0d0d; position: relative; overflow: hidden; }
  .before span { position: absolute; left: 10px; bottom: 8px; font: 9.5px var(--mono); letter-spacing: .1em; color: var(--dim); }
  .dirx { display: none; }
  body[data-dir="a"] .dirx[data-d="a"], body[data-dir="b"] .dirx[data-d="b"], body[data-dir="c"] .dirx[data-d="c"] { display: block; }
</style>
</head>

<script>
const TRI = { o: 'OBSERVABILITY', t: 'TRACEABILITY', s: 'STEERABILITY' };
const tri = (k) => `<span class="tri"><svg viewBox="0 0 13 12" aria-hidden="true"><path d="M6.5 1.5 L1.5 10.5 L11.5 10.5 Z"/><circle cx="6.5" cy="1.5" r="1.6" class="${k==='o'?'on':''}"/><circle cx="1.5" cy="10.5" r="1.6" class="${k==='t'?'on':''}"/><circle cx="11.5" cy="10.5" r="1.6" class="${k==='s'?'on':''}"/></svg>${TRI[k]}</span>`;
const words = (h) => h.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
const flag = (t) => `<p style="margin-top:8px"><span class="flag">${t}</span></p>`;

/* ── shared cards ── */
const C = {
  title: { w: 5, type: 'txt', name: 'input · the_problem', note: ['rewritten', 'Subtitle adds trace + steer'], html: `
    <p class="meta">2026 · UI concept, frontend &amp; backend contributions · Futurity Systems</p>
    <h1>Watch the machine <span class="sig">think</span></h1>
    <p class="sub">// A MULTI-AGENT PIPELINE RUNS FOR MINUTES TO HOURS. THIS INTERFACE SHOWS WHAT IT IS DOING, WHERE EACH ANSWER CAME FROM, AND WHAT YOU CAN CHANGE.</p>` },
  own: { w: 3, type: 'data', name: 'ownership', note: ['rewritten', 'Adds the workflow redesign'], html: `
    <div class="meter">
      <div><span>UI CONCEPT</span><i style="--v:100%"></i><span>100</span></div>
      <div><span>VISUAL SYSTEM</span><i style="--v:85%"></i><span>85</span></div>
      <div><span>WORKFLOW REDESIGN</span><i class="q" style="--v:100%"></i><span>?</span></div>
      <div><span>PIPELINE / BACKEND</span><i style="--v:15%"></i><span>15</span></div>
      <span class="n">TEAM BUILD. CONCEPT PROTOTYPE, VISUAL SYSTEM, STREAMING AND LIVENESS DESIGNS, AND THE WORKFLOW REDESIGN ARE MINE. THE PIPELINE IS NOT.</span></div>${flag('CONFIRM: REDESIGN SHARE')}` },
  hero: { w: 10, view: true, type: 'view', name: 'futurity_engine_view · the_workflow', note: ['new', 'Replaces the knowledge-graph run'], html: `<div class="slot new" style="height:280px"><b style="color:var(--signal)">WORKFLOW, BUILDING OVER TIME</b>SIMPLIFIED, SELF-PLAYING · DESIGNED AFTER THE WORKFLOW PORT</div>` },
  what: { w: 5, type: 'txt', name: 'txt · what_it_is', note: ['rewritten', 'New engine; CONFIRM the description'], html: `
    <p class="cs">The Futurity Engine turns a lab and a question into a research report. A run is a pipeline of about 160 steps: research jobs that read the web and file what they find, analysts that work from data and facts, a red team that argues with them, and writers that build the report one section at a time, citing every number.</p>
    <p class="cs">The Engine was our CEO's idea. I gave it its first interface, built its visual system, and designed how a long run shows itself to the person waiting on it.</p>` },
  triangle: { w: 8, type: 'txt', name: 'txt · trust_triangle', note: ['new', 'Copy kept · becomes interactive (directions next)'], html: `
    <p class="meta">HOW I JUDGE AN AI INTERFACE</p>
    <div class="tricard"><svg class="big" viewBox="0 0 170 150" aria-hidden="true"><path d="M85 22 L18 128 L152 128 Z"/><circle cx="85" cy="22" r="5"/><circle cx="18" cy="128" r="5"/><circle cx="152" cy="128" r="5"/>
      <text x="85" y="10" text-anchor="middle">OBSERVE</text><text x="18" y="146" text-anchor="middle">TRACE</text><text x="152" y="146" text-anchor="middle">STEER</text></svg>
    <dl>
      <div><dt>OBSERVABILITY</dt><dd>You can see what it is doing right now: which step is running, what it is reading, and how long it has been quiet.<span class="pt" data-pt></span></dd></div>
      <div><dt>TRACEABILITY</dt><dd>You can ask where any part came from and what was done with it. Dumping every detail on screen buries the answer, so it comes one layer at a time, as deep as you ask.<span class="pt" data-pt></span></dd></div>
      <div><dt>STEERABILITY</dt><dd>You can change exactly the part you meant. Ask an image model to make the dog blue and it used to redraw the whole picture, sometimes with a blue giraffe in it. Steering means the dog turns blue and nothing else moves.<span class="pt" data-pt></span></dd></div>
    </dl></div>` },
  triCard: { w: 4, type: 'txt', name: 'txt · trust_triangle', note: ['new', 'Accepted: layout C, icons'], html: `<svg class="tri3" viewBox="0 0 170 150" aria-label="Observe, trace, steer">
    <path class="e" d="M85 22 L18 128 L152 128 Z"/><path class="sec" d="M85,92.7 L51.5,75 M85,92.7 L118.5,75 M85,92.7 L85,128"/>
    <g class="ico" transform="translate(85 64) scale(1.05)"><path d="M-11,0 Q0,-9 11,0 Q0,9 -11,0 Z"/><circle cx="0" cy="0" r="3.4"/><circle class="solid" cx="0" cy="0" r="1.3"/></g>
    <g class="ico" transform="translate(60 106) scale(1.05)"><circle cx="-2" cy="-2" r="6.5"/><path d="M2.8,2.8 L8.5,8.5"/><path d="M-5,-2 L1,-2 M-5,1 L-1,1"/></g>
    <g class="ico" transform="translate(110 106) scale(1.05)"><rect x="-9" y="4" width="18" height="5" rx="1.6"/><path d="M0,4 L0,-4"/><circle cx="0" cy="-7" r="3.4"/><path d="M-5,4 L-5,2.5"/></g>
    <circle class="c" cx="85" cy="22" r="5"/><circle class="c" cx="18" cy="128" r="5"/><circle class="c" cx="152" cy="128" r="5"/>
    <text x="85" y="10" text-anchor="middle">OBSERVE</text><text x="18" y="146" text-anchor="middle">TRACE</text><text x="152" y="146" text-anchor="middle">STEER</text></svg>` },
  notesCard: { w: 5, type: 'txt', name: 'txt · three_corners', note: ['new', 'Cabled to the triangle'], html: `<dl class="notes3">
    <div><dt>OBSERVABILITY</dt><dd>You can see what it is doing right now: which step is running, what it is reading, and how long it has been quiet.<span class="pt">→ SECTION 01: LIVE RUN, LIVENESS, AGENT CARD</span></dd></div>
    <div><dt>TRACEABILITY</dt><dd>You can ask where any part came from and what was done with it. Dumping every detail on screen buries the answer, so it comes one layer at a time, as deep as you ask.<span class="pt">→ SECTION 02: THE WORKFLOW REDESIGN</span></dd></div>
    <div><dt>STEERABILITY</dt><dd>You can change exactly the part you meant. Ask an image model to make the dog blue and it used to redraw the whole picture, sometimes with a blue giraffe in it. Steering means the dog turns blue and nothing else moves.<span class="pt">→ SECTION 03: WHAT YOU CAN CHANGE</span></dd></div></dl>` },
  how: { w: 6, type: 'txt', name: 'process · how_it_works', note: ['rewritten', 'Workflow version; CONFIRM'], html: `
    <p class="cs">The work splits into workstreams. Groundwork gets the lab and researches the question. Engineering, Science and Business each analyze their own data. Synthesis works across them. A step starts as soon as its own inputs are ready, so many run at once.</p>
    <p class="cs">Runs take minutes to hours, and an interrupted run resumes without redoing finished steps. For that long, the person waiting needs to see what is happening.</p>` },
  d1: { w: 3, type: 'txt', name: 'decision_01 · every_step_says', note: ['new', 'Replaces "A graph, not a log"'], html: `<span class="num">01</span>${'%TRI_O%'}<h3>Every step says where it is</h3><p class="cs">Not started, running, paused, done, failed or skipped, on every step and rolled up on every workstream: "12 of 30 done · 2 running". A step that searches says what it is still waiting for.</p>` },
  d2: { w: 3, mt: 1.5, type: 'txt', name: 'decision_02 · report_fills', note: ['new', 'Replaces "Incremental everything"'], html: `<span class="num">02</span>${'%TRI_O%'}<h3>Watch the report fill</h3><p class="cs">The report shows in reading order from the start. Each section says whether it is waiting its turn, being written or done, and the knowledgebase has its own tab where you can watch it grow.</p>` },
  d3: { w: 3, mt: 3, type: 'txt', name: 'decision_03 · honest_liveness', note: ['', 'Kept'], html: `<span class="num">03</span>${'%TRI_O%'}<h3>Honest liveness</h3><p class="cs">Some steps run ten minutes without an event. The status says which of three states it is in: events flowing, quiet but alive, or stalled. I wrote the heartbeat contract before the backend emitted it.</p>${flag('CONFIRM: STILL TRUE IN THE WORKFLOW VERSION')}` },
  agent: { w: 8, view: true, type: 'view', name: 'futurity_engine_view · agent_card', note: ['', 'Kept'], html: `<div class="slot" style="height:220px"><b>AGENT CARD</b>ONE AGENT THINKING · UNCHANGED</div>` },
  outcome: { w: 5, type: 'txt', name: 'out · outcome', note: ['rewritten', 'Points back to the triangle'], html: `<p class="cs">The Engine runs as a multi-service stack with resumable checkpoints, and the interface stays responsive through runs that take most of an hour. It is where I test the three things I ask of every AI interface: that you can watch it, trace it, and steer it.</p><p class="cs">The Engine is client software, so everything on this page is a recreation on made-up data.</p>` },
  next: { w: 4, type: 'txt', name: 'next · campus_ai', note: ['', 'Kept: NextCase'], html: `<p class="meta">NEXT CASE</p><h3>Campus AI</h3>` },

  /* traceability: the redesign */
  trSect: { w: 4, type: 'txt', name: 'process · traceability', note: ['new', ''], html: `<p class="meta">PROCESS · THE WORKFLOW, REDESIGNED</p><h2>Ask where anything <span class="sig">came from</span></h2><p class="sub">The same run, folded into layers you open one at a time.</p>` },
  beforeTxt: { w: 4, type: 'txt', name: 'txt · first_view', note: ['new', ''], html: `<h3>The first workflow view</h3><p class="cs">The Engine's own workflow screen draws every step and every wire of a run at once: 161 steps in one picture. It was good to watch while it built and hard to read after. Finding why one section of the report said what it said meant following wires by eye.</p>${flag('CONFIRM: 161 STEPS OK TO CITE')}` },
  before: { w: 6, view: true, type: 'view', name: 'before · first_workflow_view', note: ['new', 'Placeholder · designed later'], html: `<div class="before" id="beforeCv"><span>BEFORE · PLACEHOLDER, RECREATED LATER WITH MADE-UP NAMES</span></div>` },
  redesign: { w: 5, type: 'txt', name: 'txt · the_redesign', note: ['new', ''], html: `<p class="cs">The redesign shows the run in three layers. Five workstreams first, each saying what it gives the report. Open one and you see its blocks; open a block and you see the engine's own steps. Select anything for its contract, what is inside it, and what happened in this run.</p><p class="cs">It is being built into the product now. The demo below is a recreation of the design on a made-up run.</p>` },
  d4: { w: 3, type: 'txt', name: 'decision_04 · layers', note: ['new', ''], html: `<span class="num">04</span>${'%TRI_T%'}<h3>One layer at a time</h3><p class="cs">Workstreams, then blocks, then steps. Each layer says where its inputs come from and what it hands on, so you can stop as soon as you have your answer.</p>` },
  d5: { w: 3, mt: 1.5, type: 'txt', name: 'decision_05 · prompt_parts', note: ['new', ''], html: `<span class="num">05</span>${'%TRI_T%'}<h3>Every prompt, part by part</h3><p class="cs">Select an AI step to read the prompt it sent, split by where each part came from: your settings, the wiring, or the engine's rules. Every answer the engine rejected is there too, with the check it failed.</p>` },
  d6: { w: 3, mt: 3, type: 'txt', name: 'decision_06 · fact_tokens', note: ['new', ''], html: `<span class="num">06</span>${'%TRI_T%'}<h3>Numbers come from data</h3><p class="cs">A writer can't type a number. It cites a fact token, and the assembly step puts in the recorded value. A sentence that can't be traced is removed before the report is published.</p>` },
  tryWf: { w: 4, type: 'txt', name: 'txt · try_it', note: ['new', ''], html: `<h3>Try it</h3><p class="cs">A recreation of the workflow view on a made-up run. Everything is clickable: open a workstream, select a step, read its prompt, or scrub the run and watch it fill.</p>` },
  wf: { w: 10, view: true, type: 'view', name: 'futurity_engine_view · workflow', note: ['new', 'Port of your React Flow prototype'], html: `<div class="slot new" style="height:520px"><b style="color:var(--signal)">WORKFLOW VIEW · RECREATION</b>REACT FLOW · MADE-UP RUN · FIXED HEIGHT
    <ol><li>Workstreams board, Provides lists, handoffs</li><li>Open a workstream, then a block, then steps</li><li>Inspector: Contract · Inside (prompt parts) · This run (rejected answers)</li><li>Timeline: scrub or play the run</li><li>Run settings: if research fails</li><li>Report and Knowledgebase tabs fill as it plays</li></ol></div>` },

  /* steerability */
  stSect: { w: 4, type: 'txt', name: 'process · steerability', note: ['new', ''], html: `<p class="meta">PROCESS · WHAT YOU CAN CHANGE</p><h2>Change exactly the <span class="sig">part you meant</span></h2><p class="sub">Before, during and after a run.</p>` },
  stTxt: { w: 5, type: 'txt', name: 'txt · steer', note: ['new', ''], html: `<p class="cs">Before a run you edit the pipeline: add, remove or rewire a step, or change its settings. During a run you decide what happens when research fails. After a run you can rerun one block with new parameters or an added instruction, or rewrite one section of the report. Everything you didn't touch stays as it was.</p>${flag('CONFIRM: WHICH OF THESE ARE BUILT')}` },
  d7: { w: 3, type: 'txt', name: 'decision_07 · pause_dependents', note: ['new', ''], html: `<span class="num">07</span>${'%TRI_S%'}<h3>Pause only what needs it</h3><p class="cs">When a research job fails, only the steps that search for it wait. Everything else keeps going, and the run asks: retry it, or go on without it. Go on, and every section written without it is flagged in the report.</p>` },
  d8: { w: 3, mt: 1.5, type: 'txt', name: 'decision_08 · rerun_one', note: ['new', ''], html: `<span class="num">08</span>${'%TRI_S%'}<h3>Rerun one block</h3><p class="cs">Change a block's settings, or add an instruction, and rerun just that block. What depends on it reruns with it. Everything else keeps the result it already had.</p>` },
  tryStr: { w: 5, type: 'txt', name: 'txt · try_steer', note: ['new', 'Uses the same demo'], html: `<p class="cs">In the demo above, open Run settings and switch "If a research job fails", then scrub to the failure. The run replays under the new setting.</p>` },
};
const brk = (n, label, note) => ({ j: 'center', cards: [{ w: 8, brk: true, note: note || ['new', ''], html: `<b>${n}</b>${label}` }] });
const row = (j, cards, extra = {}) => ({ j, cards, ...extra });

/* ── page shapes ── */
const SHAPES = {
  a: [
    row('between', [C.title, C.own]), row('center', [C.hero]), row('center', [C.what]), row('center', [C.triCard, C.notesCard], { gap: 'wide' }),
    brk('01', 'OBSERVABILITY'), row('center', [C.how]), row('between', [C.d1, C.d2, C.d3], { inset: true }), row('center', [C.agent]),
    brk('02', 'TRACEABILITY'), row('center', [C.trSect, C.beforeTxt], { gap: 'wide' }), row('center', [C.before]), row('center', [C.redesign]),
    row('between', [C.d4, C.d5, C.d6], { inset: true }), row('center', [C.tryWf]), row('center', [C.wf]),
    brk('03', 'STEERABILITY'), row('center', [C.stSect, C.stTxt], { gap: 'wide' }), row('center', [C.d7, C.d8], { gap: 'wide' }), row('center', [C.tryStr]),
    row('between', [C.outcome, C.next]),
  ],
  b: [
    row('between', [C.title, C.own]), row('center', [C.hero]), row('center', [C.what]), row('center', [C.triangle]),
    row('center', [C.how]), row('between', [C.d1, C.d2, C.d3], { inset: true }), row('center', [C.agent]), row('between', [C.outcome, C.next]),
  ],
  c: [
    row('between', [C.title, C.own]), row('center', [C.hero]), row('center', [C.what]), row('center', [C.triangle]),
    row('center', [C.how]), row('between', [C.d1, C.d2, C.d3], { inset: true }), row('center', [C.agent]),
    brk('01', 'THE WORKFLOW, REDESIGNED'), row('center', [C.trSect, C.beforeTxt], { gap: 'wide' }), row('center', [C.before]), row('center', [C.redesign]),
    row('between', [C.d4, C.d5, C.d7], { inset: true }), row('center', [C.tryWf]), row('center', [C.wf]),
    row('between', [C.outcome, C.next]),
  ],
};
/* where each corner is shown, per shape (fills the triangle card's pointers) */
const POINTERS = {
  a: ['→ SECTION 01: LIVE RUN, LIVENESS, AGENT CARD', '→ SECTION 02: THE WORKFLOW REDESIGN', '→ SECTION 03: WHAT YOU CAN CHANGE'],
  b: ['→ DECISION 03 AND THE AGENT CARD BELOW', '→ HOW IT WORKS: EVERY SIGNAL KEEPS ITS PAPERS', '→ NOT SHOWN ON THIS PAGE YET'],
  c: ['→ DECISION 03 AND THE AGENT CARD', '→ THE WORKFLOW, REDESIGNED', '→ DECISION 07: PAUSE ONLY WHAT NEEDS IT'],
};
const INTRO = {
  a: 'A (recommended): the page is built on the triangle. Three section breaks, one per corner. Observability keeps today\'s hero, liveness and agent card. Traceability is the workflow redesign with a recreated "before". Steerability says what you can change before, during and after a run, using the same demo. Longest page; the triangle reads as the argument of the whole case study.',
  b: 'B: today\'s page plus one triangle card that points to where each corner shows. Smallest change, but it exposes the gap: steerability has nothing on the page.',
  c: 'C: today\'s page, the triangle card, and one section for the workflow redesign with one steerability decision inside it. Two corners shown properly, the third as a single card.',
};
const CUT = { a: ['THE_RUN knowledge-graph hero (the workflow version has no growing graph)', 'decisions "A graph, not a log" and "Incremental everything"', 'txt · my_role (folded into what_it_is)', 'process · the_hard_problem', 'process · the_build section card'], b: ['process · the_hard_problem', 'process · the_build section card'], c: ['process · the_hard_problem', 'process · the_build section card'] };

function render() {
  const d = document.body.dataset.dir, rows = SHAPES[d];
  const fix = (h) => h.replace("%TRI_O%", tri('o')).replace("%TRI_T%", tri('t')).replace("%TRI_S%", tri('s'));
  document.getElementById('intro').textContent = INTRO[d] + ' ← → switch shapes.';
  const page = document.getElementById('page');
  page.innerHTML = rows.map((r) => {
    const cls = ['rowp', r.j].concat(r.gap === 'wide' ? ['wide-gap'] : []).join(' ');
    const pad = r.inset ? 'padding:0 calc(100% / 12);' : '';
    return `<div class="${cls}" style="${pad}">` + r.cards.map((c) => {
      const width = `width:calc(${c.w} / 12 * 100% - 13px);`;
      const mt = c.mt ? `margin-top:calc(var(--gu) * ${c.mt});` : '';
      const note = c.note && (c.note[0] || c.note[1]) ? `<span class="note ${c.note[0] === 'new' ? 'new' : ''}">${[c.note[0], c.note[1]].filter(Boolean).join(' · ')}</span>` : '';
      if (c.brk) return `<div class="op brk" style="${width}">${note}${c.html}</div>`;
      const wc = c.view || c.type === 'data' || c.name.startsWith('input') || c.name.includes('trust') ? '' : `<p class="wc">${words(c.html)} WORDS</p>`;
      return `<div class="op ${c.view ? 'view' : ''}" style="${width}${mt}">${note}<div class="hd"><span class="ty">${c.type.toUpperCase()}</span>${c.name}</div><div class="bd">${fix(c.html)}${wc}</div></div>`;
    }).join('') + `</div>`;
  }).join('') + `<div class="rowp center"><div class="op" style="width:calc(6/12*100% - 13px);border-style:dashed"><span class="note cut">cut from the current page</span><div class="bd"><ul style="padding-left:16px;font-size:12px;color:var(--muted)">${CUT[d].map((c) => `<li>${c}</li>`).join('')}</ul></div></div></div>`;
  page.querySelectorAll('[data-pt]').forEach((el, i) => { el.textContent = POINTERS[d][i]; });
  drawBefore();
}
/* a made-up dense graph at the first view's density: columns of small nodes, tangled wires */
function drawBefore() {
  const el = document.getElementById('beforeCv'); if (!el) return;
  const W = el.clientWidth || 600, H = 230; let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = 9, nodes = [];
  for (let c = 0; c < cols; c++) { const n = 5 + Math.floor(r() * 6); for (let i = 0; i < n; i++) nodes.push({ x: 20 + c * (W - 60) / (cols - 1), y: 14 + i * (H - 40) / n + r() * 6, c }); }
  const hue = ['#e6a23c', '#8a8a8a', '#4f9dde', '#5b6ee1', '#4caf6a', '#9b59d0', '#e05a9a'];
  let paths = '';
  nodes.forEach((a) => { const k = 1 + Math.floor(r() * 4); for (let j = 0; j < k; j++) { const b = nodes[Math.floor(r() * nodes.length)]; if (b.c <= a.c) continue;
    paths += `<path d="M${a.x + 26},${a.y + 4} C${a.x + 90},${a.y} ${b.x - 60},${b.y} ${b.x},${b.y + 4}" stroke="${hue[Math.floor(r() * hue.length)]}" stroke-opacity=".55" fill="none" stroke-width=".8"/>`; } });
  const rects = nodes.map((n) => `<rect x="${n.x}" y="${n.y}" width="28" height="${10 + r() * 10}" rx="1" fill="#1b1b22" stroke="#33334a" stroke-width=".6"/>`).join('');
  el.insertAdjacentHTML('afterbegin', `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${paths}${rects}</svg>`);
}

/* ── controls ── */
const state = { dir: 'a', mode: 'patch', notes: true };
function apply() {
  document.body.dataset.dir = state.dir;
  document.body.classList.toggle('read', state.mode === 'read');
  document.body.classList.toggle('notes', state.notes);
  document.querySelectorAll('[data-set-dir]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.setDir === state.dir));
  document.querySelectorAll('[data-set-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.setMode === state.mode));
  document.querySelector('[data-toggle-notes]').textContent = state.notes ? 'on' : 'off';
  try { history.replaceState(null, '', `#dir=${state.dir}&mode=${state.mode}`); } catch (e) { /* sandboxed preview */ }
  render();
}
const h = new URLSearchParams(location.hash.slice(1));
if (['a', 'b', 'c'].includes(h.get('dir'))) state.dir = h.get('dir');
if (['patch', 'read'].includes(h.get('mode'))) state.mode = h.get('mode');
document.querySelectorAll('[data-set-dir]').forEach((b) => b.onclick = () => { state.dir = b.dataset.setDir; apply(); });
document.querySelectorAll('[data-set-mode]').forEach((b) => b.onclick = () => { state.mode = b.dataset.setMode; apply(); });
document.querySelector('[data-toggle-notes]').onclick = () => { state.notes = !state.notes; apply(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  const o = ['a', 'b', 'c'], i = o.indexOf(state.dir);
  if (e.key === 'ArrowRight') { state.dir = o[(i + 1) % 3]; apply(); }
  if (e.key === 'ArrowLeft') { state.dir = o[(i + 2) % 3]; apply(); }
});
apply();
</script>
